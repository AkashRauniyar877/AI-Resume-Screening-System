version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: ai_resume_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=ai_resume_screening_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai_resume_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=ai_resume_screening_db
      - ENV=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - JWT_SECRET_KEY=c87d4a6f91e3b52d0a4c8e1f7b9a3d5c2e4f6a8b0c2d4e6f8a0b2c4d6e8f0a2b
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
    depends_on:
      - mongodb
    volumes:
      - resume_uploads:/app/backend/uploads/resumes
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: ai_resume_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongodb_data:
    driver: local
  resume_uploads:
    driver: local

networks:
  app-network:
    driver: bridge

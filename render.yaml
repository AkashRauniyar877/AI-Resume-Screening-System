services:
  # ---------------------------------------------------------------------------
  # Backend API Service (FastAPI + PyTorch / Sentence-Transformers AI Engine)
  # ---------------------------------------------------------------------------
  - type: web
    name: ai-resume-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: ai_resume_screening
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "0"
      - key: DEBUG
        value: "False"

  # ---------------------------------------------------------------------------
  # Frontend Static Site (React 19 + Vite 8 + Tailwind CSS)
  # ---------------------------------------------------------------------------
  - type: web
    name: ai-resume-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
